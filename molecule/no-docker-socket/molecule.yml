---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
driver:
  name: docker
platforms:
  - name: ubuntu-22.04-no-docker-socket
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: ""
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
  playbooks:
    prepare: ../default/prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      ubuntu-22.04-no-docker-socket:
        github_runner_personal_access_token: "test-token-no-docker-socket"
        github_runner_name: "test-runner-no-docker-socket"
        github_runner_repo: "test/repo"
        github_runner_labels: "self-hosted,jvm"
        github_runner_java: true
        github_runner_mount_docker_socket: false
        # Digest-pinned like Renovate pins it: the idempotence converge fails if
        # the drain gate misreads this form as a change (it'd hit the API with
        # the fake token).
        github_runner_java_image: "compscidr/github-runner-android:latest@sha256:dd3d2e869a352efc027c07da44bab983d3b1878b612d5ff6b725315742eddd85"
verifier:
  name: ansible
